name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支上只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # 固定 Python：需匹配 requires-python (>=3.11.12)，且 pygame 2.6.1
          # 对更新的 Python 没有预编译 wheel，会退化成源码编译并缺 SDL 头文件
          python-version: "3.11.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # pygame 在无显示环境下需要 dummy 驱动
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # 固定 Python：需匹配 requires-python (>=3.11.12)，且 pygame 2.6.1
          # 对更新的 Python 没有预编译 wheel，会退化成源码编译并缺 SDL 头文件
          python-version: "3.11.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Import smoke test
        run: uv run python -c "import floodit.floodit; print('imports OK')"
