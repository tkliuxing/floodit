name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发只产出 artifacts，不创建 Release，便于验证打包
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # 单文件 exe，双击即可运行；--windowed 去掉控制台窗口
      - name: Build .exe
        run: >
          uv run pyinstaller --noconfirm --clean
          --onefile --windowed --name FloodIt main.py

      - name: Rename artifact
        run: Move-Item dist/FloodIt.exe FloodIt-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloodIt-windows-x86_64
          path: FloodIt-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
