[project]
name = "floodit"
version = "0.1.0"
description = "A Python and Pygame implementation of the Flood It! coloring game."
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
floodit = "floodit.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "ruff>=0.15.22",
]
