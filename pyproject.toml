# 用 hatchling 而非 setuptools：仓库里的 setup.py 只服务于 py2app
# (setup_requires=["py2app"])，让 setuptools 接管会把它一起拖进构建流程。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floodit"
version = "0.2.0"
description = "A Python and Pygame implementation of the Flood It! coloring game."
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
floodit = "floodit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["floodit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
