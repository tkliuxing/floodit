[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floodit"
version = "0.3.0"
description = "A Python and Pygame implementation of the Flood It! coloring game."
readme = "README.md"
authors = [{ name = "Ronald Bai", email = "ouyanghongyu@gmail.com" }]
requires-python = ">=3.11.12"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
floodit = "floodit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["floodit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
